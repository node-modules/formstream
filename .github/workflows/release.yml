name: Release

on:
  push:
    branches: [ master ]

jobs:
  release:
    name: Node.js
    permissions:
      contents: write
      deployments: write
      id-token: write
    uses: node-modules/github-actions/.github/workflows/node-release.yml@master
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
